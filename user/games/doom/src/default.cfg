# Alcor2OS Doom default configuration — ZQSD + mouse layout.
#
# Key values are Doom key codes (see doomkeys.h):
#   z=122  q=113  s=115  d=100  a=97  e=101
#   KEY_LEFTARROW=172  KEY_RIGHTARROW=174
#   KEY_RSHIFT=182
#
# Controls:
#   Z / S          — move forward / backward
#   Q / D          — strafe left / right
#   ← / →          — turn left / right  (mouse also turns)
#   A              — fire (keyboard)
#   E              — use / open door
#   Mouse X        — turn camera
#   Left click     — fire
#   Right click    — use / open door
#   Shift          — run
#   Escape         — open / close menu
#   F1             — help   F2 — save   F3 — load
#   F6             — quicksave   F9 — quickload   F10 — quit
mouse_sensitivity 5
use_mouse 1
key_right 174
key_left 172
key_up 122
key_down 115
key_strafeleft 113
key_straferight 100
key_fire 97
key_use 101
key_strafe 184
key_speed 182
key_menu_up 122
key_menu_down 115
key_menu_left 172
key_menu_right 174
mouseb_fire 0
mouseb_strafe -1
mouseb_use 1
mouseb_forward -1
