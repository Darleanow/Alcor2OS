# The ISO built here is kernel-only; the full disk image is in release.yml.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MUSL_VER:    "1.2.6"
  LIMINE_REV:  "v9.x-binary"
  LLVM_VER:    "18"

jobs:
  lint:
    name: Lint, format check & QA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl gnupg ca-certificates
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-format-21 \
            clang-tidy-18 \
            cppcheck \
            libfreetype-dev \
            libharfbuzz-dev
          sudo update-alternatives \
            --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          mkdir -p thirdparty/freetype-install/usr/include
          ln -s /usr/include/freetype2 thirdparty/freetype-install/usr/include/freetype2
          mkdir -p thirdparty/harfbuzz-install/usr/include
          ln -s /usr/include/harfbuzz thirdparty/harfbuzz-install/usr/include/harfbuzz

      - name: Restore musl cache
        uses: actions/cache@v5
        with:
          path: thirdparty/musl
          key: musl-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}
          restore-keys: |
            musl-${{ env.MUSL_VER }}-

      - name: Build musl (if cache miss)
        run: make musl

      - name: clang-format diff check
        run: |
          find src include user \
            \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \) \
            ! -path '*/thirdparty/*' \
            ! -path '*/.cache/*' \
            ! -path '*/doomgeneric/*' \
            -print0 \
          | xargs -0 clang-format-21 --dry-run --Werror 2>&1 \
          || { echo "Format violations. Run: make fmt"; exit 1; }

      - name: make qa (clang-tidy + cppcheck)
        run: make qa

  build:
    name: Build kernel ISO (clang-18, ccache)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # limine clone inside Makefile needs history

      - name: Checkout ABI contract submodule
        run: git submodule update --init thirdparty/musl-src

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            nasm \
            xorriso \
            mtools \
            e2fsprogs \
            curl \
            git \
            make \
            ccache \
            ca-certificates

          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-18   100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-18  100

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-clang18-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'include/**/*.h') }}
          restore-keys: |
            ccache-clang18-

      - name: Configure ccache
        run: |
          ccache --max-size=512M
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore Limine cache
        id: cache-limine
        uses: actions/cache@v5
        with:
          path: thirdparty/limine
          key: limine-${{ env.LIMINE_REV }}-${{ hashFiles('mk/versions.mk') }}
          restore-keys: |
            limine-${{ env.LIMINE_REV }}-

      - name: Restore musl cache
        id: cache-musl
        uses: actions/cache@v5
        with:
          path: thirdparty/musl
          key: musl-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}
          restore-keys: |
            musl-${{ env.MUSL_VER }}-

      - name: Build kernel + ISO (kernel-only, fast)
        run: |
          make iso-kernel \
            CC=clang \
            LD=ld.lld \
            CCACHE=1 \
            -j$(nproc) \
            2>&1

      - name: Print ccache stats
        if: always()
        run: ccache --show-stats

      # Skip save on an exact key hit (re-saving the same key errors on GH Cache).
      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ccache-clang18-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'include/**/*.h') }}

      - name: Prepare artifact metadata
        run: |
          mkdir -p release
          cp build/alcor2.iso release/alcor2.iso
          cat > release/BUILD_INFO.txt <<EOF
          Alcor2 OS - CI build
          ====================
          Commit  : ${{ github.sha }}
          Ref     : ${{ github.ref_name }}
          Runner  : ubuntu-24.04 / clang-18
          ccache  : ${{ steps.ccache-restore.outputs.cache-hit == 'true' && 'HIT' || 'MISS (first build or key changed)' }}
          Date    : $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: alcor2-iso-${{ github.sha }}
          path: |
            release/alcor2.iso
            release/BUILD_INFO.txt
          retention-days: 14
          compression-level: 0   # ISO is already compressed

  user-apps:
    name: Build userland + apps (musl-cross)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            g++ \
            nasm \
            curl \
            git \
            make \
            ca-certificates \
            meson \
            ninja-build

      - name: Restore Limine cache
        uses: actions/cache@v5
        with:
          path: thirdparty/limine
          key: limine-${{ env.LIMINE_REV }}-${{ hashFiles('mk/versions.mk') }}
          restore-keys: |
            limine-${{ env.LIMINE_REV }}-

      - name: Restore musl cache
        uses: actions/cache@v5
        with:
          path: thirdparty/musl
          key: musl-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}
          restore-keys: |
            musl-${{ env.MUSL_VER }}-

      - name: Restore heavy third-party cache (musl-cross for user/apps)
        uses: actions/cache@v5
        with:
          path: |
            thirdparty/musl-cross
            thirdparty/clang-install
            thirdparty/freetype-install
            thirdparty/harfbuzz-install
            thirdparty/ncurses-install
          key: thirdparty-heavy-${{ env.LLVM_VER }}-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}

      - name: Build userland (crt, shell, apps/)
        run: make user -j$(nproc)

      - name: List user build outputs
        run: |
          ls -la user/build/apps/ 2>/dev/null || true
          ls -la user/build/bin/   2>/dev/null || true
