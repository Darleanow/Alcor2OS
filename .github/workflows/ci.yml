# ci.yml: runs on every push and pull-request (all branches).
#
# Jobs:
#   lint          clang-format diff check + cppcheck
#   build         kernel compiled with clang-18 + ccache into a bootable ISO
#   unit-tests    cmocka tests + lcov/genhtml coverage report
#   build-docs    Doxygen HTML documentation
#   deploy-pages  assemble coverage + docs → gh-pages (main only)
#   user-apps     musl + musl-cross + full user/ (C and C++ apps)
#
# GitHub Pages setup (one-time):
#   Settings → Pages → Source: Deploy from branch → gh-pages → / (root)
#
#   Landing : https://darleanow.github.io/Alcor2OS/
#   Coverage: https://darleanow.github.io/Alcor2OS/coverage/
#   Docs    : https://darleanow.github.io/Alcor2OS/docs/
#
# The build ISO is kernel-only (fast); the full disk image is in release.yml.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MUSL_VER:    "1.2.5"
  LIMINE_REV:  "v8.x-binary"
  LLVM_VER:    "18"

jobs:
  # Lint & QA
  lint:
    name: Lint, format check & QA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl gnupg ca-certificates
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-format-21 \
            clang-tidy-18 \
            cppcheck \
            libfreetype-dev \
            libharfbuzz-dev
          sudo update-alternatives \
            --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          mkdir -p thirdparty/freetype-install/usr/include
          ln -s /usr/include/freetype2 thirdparty/freetype-install/usr/include/freetype2
          mkdir -p thirdparty/harfbuzz-install/usr/include
          ln -s /usr/include/harfbuzz thirdparty/harfbuzz-install/usr/include/harfbuzz

      - name: Restore musl cache
        uses: actions/cache@v5
        with:
          path: thirdparty/musl
          key: musl-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}
          restore-keys: |
            musl-${{ env.MUSL_VER }}-

      - name: Build musl (if cache miss)
        run: make musl

      - name: clang-format diff check
        run: |
          find src include user \
            \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \) \
            ! -path '*/thirdparty/*' \
            ! -path '*/.cache/*' \
            ! -path '*/doomgeneric/*' \
            -print0 \
          | xargs -0 clang-format-21 --dry-run --Werror 2>&1 \
          || { echo "Format violations. Run: make fmt"; exit 1; }

      - name: make qa (clang-tidy + cppcheck)
        run: make qa

  # Build kernel ISO
  build:
    name: Build kernel ISO (clang-18, ccache)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # limine clone inside Makefile needs history

      # System packages
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            nasm \
            xorriso \
            mtools \
            e2fsprogs \
            curl \
            git \
            make \
            ccache \
            ca-certificates

          # Expose clang-18 as plain `clang` / `ld.lld` for the Makefile
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-18   100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-18  100

      # ccache: key hashes all sources; restore-key falls back to the last cache.
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-clang18-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'include/**/*.h') }}
          restore-keys: |
            ccache-clang18-

      - name: Configure ccache
        run: |
          ccache --max-size=512M
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # Third-party: Limine
      # Key: version string + versions.mk hash (changes when LIMINE_REV changes)
      - name: Restore Limine cache
        id: cache-limine
        uses: actions/cache@v5
        with:
          path: thirdparty/limine
          key: limine-${{ env.LIMINE_REV }}-${{ hashFiles('mk/versions.mk') }}
          restore-keys: |
            limine-${{ env.LIMINE_REV }}-

      # Third-party: musl
      - name: Restore musl cache
        id: cache-musl
        uses: actions/cache@v5
        with:
          path: thirdparty/musl
          key: musl-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}
          restore-keys: |
            musl-${{ env.MUSL_VER }}-

      # Build
      - name: Build kernel + ISO (kernel-only, fast)
        run: |
          make iso-kernel \
            CC=clang \
            LD=ld.lld \
            CCACHE=1 \
            -j$(nproc) \
            2>&1

      - name: Print ccache stats
        if: always()
        run: ccache --show-stats

      # Skip save on an exact key hit (re-saving the same key errors on GH Cache).
      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ccache-clang18-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'include/**/*.h') }}

      # Artifact
      - name: Prepare artifact metadata
        run: |
          mkdir -p release
          cp build/alcor2.iso release/alcor2.iso
          cat > release/BUILD_INFO.txt <<EOF
          Alcor2 OS - CI build
          ====================
          Commit  : ${{ github.sha }}
          Ref     : ${{ github.ref_name }}
          Runner  : ubuntu-24.04 / clang-18
          ccache  : ${{ steps.ccache-restore.outputs.cache-hit == 'true' && 'HIT' || 'MISS (first build or key changed)' }}
          Date    : $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: alcor2-iso-${{ github.sha }}
          path: |
            release/alcor2.iso
            release/BUILD_INFO.txt
          retention-days: 14
          compression-level: 0   # ISO is already compressed

  # Host-compiled unit tests + coverage report
  unit-tests:
    name: Unit tests + coverage (cmocka, llvm-cov)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            llvm-18 \
            libcmocka-dev \
            lcov \
            nasm \
            make
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Run unit tests + coverage
        run: make coverage

      - name: Coverage summary
        if: always()
        run: cat tests/build/coverage/coverage.txt || true

      - name: Upload coverage report (genhtml)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ github.sha }}
          path: tests/build/coverage/html
          retention-days: 14

      - name: Upload lcov tracefile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-${{ github.sha }}
          path: tests/build/coverage/lcov.info
          retention-days: 14

  # Build Doxygen documentation
  build-docs:
    name: Build Doxygen docs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Generate Doxygen
        run: doxygen docs/Doxyfile

      - name: Upload Doxygen artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-html-${{ github.sha }}
          path: docs/doxygen/html
          retention-days: 14

  # Deploy coverage + docs to GitHub Pages (main branch only)
  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [unit-tests, build-docs]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Download coverage HTML
        uses: actions/download-artifact@v4
        with:
          name: coverage-html-${{ github.sha }}
          path: site/coverage

      - name: Download Doxygen HTML
        uses: actions/download-artifact@v4
        with:
          name: doxygen-html-${{ github.sha }}
          path: site/docs

      - name: Create landing page
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Alcor2OS — Developer Portal</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 1rem; }
              h1 { font-size: 2rem; }
              a.card { display: block; padding: 1.5rem; margin: 1rem 0; border: 1px solid #ddd;
                       border-radius: 8px; text-decoration: none; color: inherit; }
              a.card:hover { background: #f5f5f5; }
              a.card h2 { margin: 0 0 .4rem; font-size: 1.2rem; }
              a.card p { margin: 0; color: #555; font-size: .9rem; }
            </style>
          </head>
          <body>
            <h1>Alcor2OS</h1>
            <a class="card" href="coverage/">
              <h2>Coverage Report</h2>
              <p>Unit test line, branch and function coverage (genhtml)</p>
            </a>
            <a class="card" href="docs/">
              <h2>API Documentation</h2>
              <p>Source-level documentation generated by Doxygen</p>
            </a>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          commit_message: "chore: update pages [coverage + docs] @ ${{ github.sha }}"

  # Userland + apps (needs musl-cross for C++ targets)
  user-apps:
    name: Build userland + apps (musl-cross)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc \
            g++ \
            nasm \
            curl \
            git \
            make \
            ca-certificates \
            meson \
            ninja-build

      - name: Restore Limine cache
        uses: actions/cache@v5
        with:
          path: thirdparty/limine
          key: limine-${{ env.LIMINE_REV }}-${{ hashFiles('mk/versions.mk') }}
          restore-keys: |
            limine-${{ env.LIMINE_REV }}-

      - name: Restore musl cache
        uses: actions/cache@v5
        with:
          path: thirdparty/musl
          key: musl-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}
          restore-keys: |
            musl-${{ env.MUSL_VER }}-

      - name: Restore heavy third-party cache (musl-cross for user/apps)
        uses: actions/cache@v5
        with:
          path: |
            thirdparty/musl-cross
            thirdparty/clang-install
            thirdparty/freetype-install
            thirdparty/harfbuzz-install
            thirdparty/ncurses-install
          key: thirdparty-heavy-${{ env.LLVM_VER }}-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}

      - name: Build userland (crt, shell, apps/)
        run: make user -j$(nproc)

      - name: List user build outputs
        run: |
          ls -la user/build/apps/ 2>/dev/null || true
          ls -la user/build/bin/   2>/dev/null || true
