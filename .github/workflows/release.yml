# release.yml: full build (ISO + 1 GiB ext2 disk image) on a v* tag.
# Release notes are generated against the previous tag.
# ccache and thirdparty deps are cached across runs.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only one release build at a time per branch/tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # don't cancel in-flight release builds

permissions:
  contents: write   # needed to create / update GitHub Releases

env:
  MUSL_VER:       "1.2.5"
  LIMINE_REV:     "v8.x-binary"
  TCC_VER:        "0.9.27"
  LLVM_VER:       "18"

jobs:
  # Full build (ISO + disk image)
  build-full:
    name: Full build (ISO + disk image)
    runs-on: ubuntu-24.04

    outputs:
      iso_artifact: alcor2-iso-${{ github.sha }}
      disk_artifact: alcor2-disk-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # System packages
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            gcc \
            nasm \
            xorriso \
            mtools \
            e2fsprogs \
            fuse2fs \
            curl \
            git \
            make \
            ccache \
            ca-certificates \
            meson \
            ninja-build

          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-18   100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-18  100

      # ccache
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ccache-clang18-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'include/**/*.h') }}
          restore-keys: |
            ccache-clang18-

      - name: Configure ccache
        run: |
          ccache --max-size=512M
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # Third-party caches
      - name: Restore Limine cache
        uses: actions/cache@v5
        with:
          path: thirdparty/limine
          key: limine-${{ env.LIMINE_REV }}-${{ hashFiles('mk/versions.mk') }}
          restore-keys: |
            limine-${{ env.LIMINE_REV }}-

      - name: Restore musl cache
        uses: actions/cache@v5
        with:
          path: thirdparty/musl
          key: musl-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}
          restore-keys: |
            musl-${{ env.MUSL_VER }}-

      - name: Restore heavy third-party cache
        uses: actions/cache@v5
        with:
          path: |
            thirdparty/musl-cross
            thirdparty/clang-install
            thirdparty/freetype-install
            thirdparty/harfbuzz-install
            thirdparty/ncurses-install
          key: thirdparty-heavy-${{ env.LLVM_VER }}-${{ env.MUSL_VER }}-${{ hashFiles('mk/thirdparty.mk', 'mk/versions.mk') }}

      # Build kernel + full ISO (with user/)
      - name: Build kernel
        run: |
          make kernel \
            CC=clang \
            LD=ld.lld \
            CCACHE=1 \
            -j$(nproc)

      - name: Build third-party dependencies
        run: |
          make clang ncurses freetype harfbuzz \
            -j$(nproc)

      - name: Build userland
        run: |
          make user \
            -j$(nproc)

      - name: Build ISO (kernel + userland)
        run: |
          make iso \
            CC=clang \
            LD=ld.lld \
            -j$(nproc)

      # Skip save when restore had an exact key hit; saving the same key fails on GH Cache.
      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ccache-clang18-${{ hashFiles('src/**/*.c', 'src/**/*.h', 'include/**/*.h') }}

      - name: Print ccache stats
        if: always()
        run: ccache --show-stats

      # Build disk image
      - name: Create ext2 disk image
        run: make disk

      - name: Populate disk image
        run: |
          # fuse2fs is installed, no sudo needed
          make disk-populate

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp build/alcor2.iso  release/alcor2.iso
          cp disk.img          release/disk.img

          cat > release/BUILD_INFO.txt <<EOF
          Alcor2 OS - Release build
          =========================
          Tag     : ${{ github.ref_name }}
          Commit  : ${{ github.sha }}
          Compiler: clang-${{ env.LLVM_VER }}
          Runner  : ubuntu-24.04
          Date    : $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EOF

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: alcor2-iso-${{ github.sha }}
          path: release/alcor2.iso
          retention-days: 30
          compression-level: 0

      - name: Upload disk image artifact
        uses: actions/upload-artifact@v7
        with:
          name: alcor2-disk-${{ github.sha }}
          path: release/disk.img
          retention-days: 30
          compression-level: 0

      - name: Upload build info artifact
        uses: actions/upload-artifact@v7
        with:
          name: alcor2-build-info-${{ github.sha }}
          path: release/BUILD_INFO.txt
          retention-days: 30

  # Publish GitHub Release
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build-full

    steps:
      - name: Download ISO
        uses: actions/download-artifact@v7
        with:
          name: alcor2-iso-${{ github.sha }}
          path: release

      - name: Download disk image
        uses: actions/download-artifact@v7
        with:
          name: alcor2-disk-${{ github.sha }}
          path: release

      - name: Download build info
        uses: actions/download-artifact@v7
        with:
          name: alcor2-build-info-${{ github.sha }}
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Alcor2 ${{ github.ref_name }}"
          prerelease: false
          draft: false
          make_latest: true
          generate_release_notes: true
          body: |
            Alcor2 ${{ github.ref_name }}, built from
            [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) with clang-${{ env.LLVM_VER }}.

            ## Assets
            | File | Description |
            |------|-------------|
            | `alcor2.iso` | Bootable ISO (BIOS + UEFI) |
            | `disk.img` | Pre-populated ext2 disk (userland) |
            | `BUILD_INFO.txt` | Build metadata |

            ## Boot
            ```bash
            qemu-system-x86_64 -cdrom alcor2.iso \
              -drive file=disk.img,format=raw,if=ide,cache=writeback \
              -boot order=d -m 2048M -enable-kvm
            ```
          files: |
            release/alcor2.iso
            release/disk.img
            release/BUILD_INFO.txt
